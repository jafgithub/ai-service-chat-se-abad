<div class="head"><span class="badge">Section 3.1</span><h1>Route A: the whole journey</h1></div>
<p class="sub">Six stages. Only stages 4 and 5 need any thought, and they are the same list every time.</p>
<svg viewBox="0 0 1360 300"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6b86"/></marker></defs><rect x="30" y="70" width="190" height="130" rx="12" class="ok"/><circle cx="56" cy="96" r="17" fill="#c2451b"/><text class="n" x="56" y="101">1</text><text class="t" x="138" y="101">Snapshot</text><text class="s" x="125" y="140">take the picture,</text><text class="s" x="125" y="160">nothing stops</text><rect x="250" y="70" width="190" height="130" rx="12" class="ok"/><circle cx="276" cy="96" r="17" fill="#c2451b"/><text class="n" x="276" y="101">2</text><text class="t" x="358" y="101">Launch</text><text class="s" x="345" y="140">new machine</text><text class="s" x="345" y="160">from the picture</text><line x1="220" y1="135" x2="244" y2="135" stroke="#5b6b86" stroke-width="1.8" marker-end="url(#a)"/><rect x="470" y="70" width="190" height="130" rx="12" class="you"/><circle cx="496" cy="96" r="17" fill="#c2451b"/><text class="n" x="496" y="101">3</text><text class="t" x="578" y="101">Address</text><text class="s" x="565" y="140">static IP,</text><text class="s" x="565" y="160">DNS record</text><line x1="440" y1="135" x2="464" y2="135" stroke="#5b6b86" stroke-width="1.8" marker-end="url(#a)"/><rect x="690" y="70" width="190" height="130" rx="12" class="you"/><circle cx="716" cy="96" r="17" fill="#c2451b"/><text class="n" x="716" y="101">4</text><text class="t" x="798" y="101">Change</text><text class="s" x="785" y="140">name, certificate,</text><text class="s" x="785" y="160">two passwords</text><line x1="660" y1="135" x2="684" y2="135" stroke="#5b6b86" stroke-width="1.8" marker-end="url(#a)"/><rect x="910" y="70" width="190" height="130" rx="12" class="warn"/><circle cx="936" cy="96" r="17" fill="#c2451b"/><text class="n" x="936" y="101">5</text><text class="t" x="1018" y="101">Clear out</text><text class="s" x="1005" y="140">old bookings,</text><text class="s" x="1005" y="160">the leftovers</text><line x1="880" y1="135" x2="904" y2="135" stroke="#5b6b86" stroke-width="1.8" marker-end="url(#a)"/><rect x="1130" y="70" width="190" height="130" rx="12" class="you"/><circle cx="1156" cy="96" r="17" fill="#c2451b"/><text class="n" x="1156" y="101">6</text><text class="t" x="1238" y="101">Check</text><text class="s" x="1225" y="140">the same four</text><text class="s" x="1225" y="160">checks</text><line x1="1100" y1="135" x2="1124" y2="135" stroke="#5b6b86" stroke-width="1.8" marker-end="url(#a)"/><text class="lb" x="680" y="245">stages 1 and 2 are clicks in the Lightsail console; 3 to 6 are on the new machine</text></svg>
<p class="note"><b>Stage 3 before stage 4.</b> The certificate in stage 4 is only issued once the new subdomain really answers with the new address, and that can take a few minutes to spread.</p>
