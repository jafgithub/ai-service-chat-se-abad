<div class="head"><span class="badge">Before you send</span><h1>What we can use, and what we cannot</h1></div>
<p class="sub">One check decides most of it, and you can do it in five seconds.</p>
<svg viewBox="0 0 1360 300"><rect x="24" y="20" width="420" height="220" rx="12" class="ok"/><path d="M24 66 v-34 a12 12 0 0 1 12 -12 h396 a12 12 0 0 1 12 12 v34 z" fill="#2f6b4c"/><text class="hd" x="42" y="51">Send these</text><text class="li" x="42" y="102">a PDF you can select text in</text><text class="li" x="42" y="133">the current, approved version</text><text class="li" x="42" y="164">Serenity Point's own documents</text><text class="li" x="42" y="195">rules, fees, forms, procedures</text><rect x="470" y="20" width="420" height="220" rx="12" class="you"/><path d="M470 66 v-34 a12 12 0 0 1 12 -12 h396 a12 12 0 0 1 12 12 v34 z" fill="#b1791a"/><text class="hd" x="488" y="51">Tell us as well</text><text class="li" x="488" y="102">the date it was approved</text><text class="li" x="488" y="133">what it replaces, if anything</text><text class="li" x="488" y="164">whether it is for residents</text><text class="li" x="488" y="195">or for the office only</text><rect x="916" y="20" width="420" height="220" rx="12" class="warn"/><path d="M916 66 v-34 a12 12 0 0 1 12 -12 h396 a12 12 0 0 1 12 12 v34 z" fill="#c2451b"/><text class="hd" x="934" y="51">These cannot be used</text><text class="li" x="934" y="102">scans and photographs of paper</text><text class="li" x="934" y="133">documents for another community</text><text class="li" x="934" y="164">drafts and superseded versions</text><text class="li" x="934" y="195">spreadsheets of personal data</text><text class="lb" x="680" y="275">the test for the first column: open the PDF, try to select a sentence with the mouse</text></svg>
<p class="note"><b>If you cannot select the text, neither can we.</b> A scan is a picture of words, not words. It has to be re-exported from whatever produced it, or run through text recognition first.</p>
