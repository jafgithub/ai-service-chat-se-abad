<div class="head"><span class="badge">How it works</span><h1>What happens to a document you send</h1></div>
<p class="sub">Five steps. Only the first two need anything from you.</p>
<svg viewBox="0 0 1360 290"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6b86"/></marker></defs><rect x="60" y="60" width="210" height="130" rx="12" class="you"/><circle cx="88" cy="88" r="17" fill="#c2451b"/><text class="n" x="88" y="93">1</text><text class="t" x="180" y="93">You send it</text><text class="s" x="165" y="132">email the PDF</text><rect x="310" y="60" width="210" height="130" rx="12" class="you"/><circle cx="338" cy="88" r="17" fill="#c2451b"/><text class="n" x="338" y="93">2</text><text class="t" x="430" y="93">We check it</text><text class="s" x="415" y="132">readable? whose?</text><text class="s" x="415" y="152">still current?</text><line x1="270" y1="125" x2="302" y2="125" stroke="#5b6b86" stroke-width="1.8" marker-end="url(#a)"/><rect x="560" y="60" width="210" height="130" rx="12" class="sys"/><circle cx="588" cy="88" r="17" fill="#c2451b"/><text class="n" x="588" y="93">3</text><text class="t" x="680" y="93">We cut it up</text><text class="s" x="665" y="132">by rule and</text><text class="s" x="665" y="152">by section</text><line x1="520" y1="125" x2="552" y2="125" stroke="#5b6b86" stroke-width="1.8" marker-end="url(#a)"/><rect x="810" y="60" width="210" height="130" rx="12" class="sys"/><circle cx="838" cy="88" r="17" fill="#c2451b"/><text class="n" x="838" y="93">4</text><text class="t" x="930" y="93">We index it</text><text class="s" x="915" y="132">one command</text><line x1="770" y1="125" x2="802" y2="125" stroke="#5b6b86" stroke-width="1.8" marker-end="url(#a)"/><rect x="1060" y="60" width="210" height="130" rx="12" class="ok"/><circle cx="1088" cy="88" r="17" fill="#c2451b"/><text class="n" x="1088" y="93">5</text><text class="t" x="1180" y="93">It answers</text><text class="s" x="1165" y="132">panel and</text><text class="s" x="1165" y="152">booking chat</text><line x1="1020" y1="125" x2="1052" y2="125" stroke="#5b6b86" stroke-width="1.8" marker-end="url(#a)"/><text class="lb" x="680" y="235">about a day from the email arriving, most of it step 2</text></svg>
<p class="note"><b>Step 2 is where documents stop.</b> Two of the six sent on 20 August could not go past it, and the reasons are on the next page.</p>
