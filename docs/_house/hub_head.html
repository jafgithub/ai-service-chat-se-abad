<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Documents</title>
<style>
:root {
  --bg:#FFFFFF; --ink:#14130F; --muted:#77726A; --faint:#A8A29A;
  --line:#E9E6E1; --sunk:#FAF8F5; --accent:#C25317; --good:#2F6B4C;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#131211; --ink:#F0EDE7; --muted:#A29C93; --faint:#736D65;
          --line:#2B2926; --sunk:#1B1917; --accent:#E8905A; --good:#71C295; }
}
:root[data-theme="dark"] {
  --bg:#131211; --ink:#F0EDE7; --muted:#A29C93; --faint:#736D65;
  --line:#2B2926; --sunk:#1B1917; --accent:#E8905A; --good:#71C295;
}
:root[data-theme="light"] {
  --bg:#FFFFFF; --ink:#14130F; --muted:#77726A; --faint:#A8A29A;
  --line:#E9E6E1; --sunk:#FAF8F5; --accent:#C25317; --good:#2F6B4C;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0 auto; max-width: 900px; padding: 60px 28px 120px;
  background: var(--bg); color: var(--ink);
  font: 17px/1.62 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.eyebrow {
  font-size: 11.5px; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--accent); font-weight: 650; margin: 0 0 12px;
}
h1 {
  font-size: clamp(30px, 4.2vw, 40px); line-height: 1.13; letter-spacing: -0.025em;
  font-weight: 650; margin: 0 0 14px; text-wrap: balance;
}
.lede { color: var(--muted); font-size: 18px; margin: 0 0 26px; max-width: 62ch; }

/* Jump to a section without scrolling past the other one. */
.jump { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 34px; }
.jump a {
  text-decoration: none; color: var(--ink); background: var(--sunk);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 15px; font-size: 14.5px; font-weight: 600;
}
.jump a:hover { border-color: var(--accent); color: var(--accent); }

.find {
  width: 100%; padding: 12px 15px; margin: 0 0 8px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--sunk); color: var(--ink); font: inherit; font-size: 15.5px;
}
.find:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.count { color: var(--faint); font-size: 13.5px; margin: 0 0 30px; min-height: 20px; }

section { margin: 0 0 54px; scroll-margin-top: 20px; }
h2 {
  font-size: 21px; font-weight: 650; letter-spacing: -0.012em;
  margin: 0 0 6px; padding-top: 26px; border-top: 1px solid var(--line);
}
.blurb { color: var(--muted); font-size: 15.5px; margin: 0 0 20px; max-width: 66ch; }

a.card {
  display: block; text-decoration: none; color: inherit;
  border: 1px solid var(--line); border-radius: 12px;
  padding: 17px 19px; margin: 0 0 11px; background: var(--bg);
}
a.card:hover { border-color: var(--accent); background: var(--sunk); }
.card .top { display: flex; align-items: baseline; gap: 11px; flex-wrap: wrap; }
.card .name { font-size: 17.5px; font-weight: 650; letter-spacing: -0.01em; }
.card .kind {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  font-weight: 700; color: var(--accent); background: var(--sunk);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
  white-space: nowrap;
}
.card .desc { color: var(--muted); font-size: 15.5px; margin: 5px 0 0; }
.card .when { color: var(--faint); font-size: 13px; margin: 7px 0 0; }

.word { margin: 16px 0 0; padding: 15px 18px; background: var(--sunk);
        border: 1px solid var(--line); border-radius: 12px; }
.word p { margin: 0 0 9px; font-size: 13px; letter-spacing: 0.07em;
          text-transform: uppercase; font-weight: 700; color: var(--faint); }
.word ul { margin: 0; padding: 0; list-style: none;
           display: flex; flex-wrap: wrap; gap: 8px 10px; }
.word a { font-size: 14.5px; color: var(--ink); text-decoration: none;
          border-bottom: 1px solid var(--line); }
.word a:hover { color: var(--accent); border-color: var(--accent); }

.empty { color: var(--faint); font-size: 15.5px; display: none; }
footer { color: var(--faint); font-size: 14px; border-top: 1px solid var(--line);
         padding-top: 22px; margin-top: 10px; }
@media (max-width: 640px) {
  body { padding: 40px 18px 80px; font-size: 16px; }
}
</style>
</head>
